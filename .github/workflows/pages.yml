name: Publicar demonstração ORBI no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
