nt-size:12px;color:var(--muted);max-width:850px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;background:var(--navy);color:white;padding:22px;border-radius:9px;margin-bottom:14px}.hero h2{font-size:24px;line-height:1.12;margin:7px 0}.hero p{font-size:12px;color:#c8dbd5;max-width:580px}.hero .mini{font-size:9px;color:#a9cdbf;letter-spacing:.14em}.hero-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.hero-flow span{padding:10px 5px;text-align:center;border:1px solid #ffffff30;border-radius:5px;font-size:9px;color:#d4e1de}.hero-flow b{display:block;color:white;font-size:10px;margin-bottom:3px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}.kpi,.panel{background:white;border:1px solid var(--line);border-radius:7px}.kpi{padding:12px}.kpi small{display:block;font-size:9px;color:var(--muted)}.kpi b{font-size:21px;display:block;margin:2px 0}.kpi span{font-size:9px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{overflow:hidden;margin-bottom:12px}.ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.ph h2{font-size:14px;margin:0}.ph p{font-size:10px;color:var(--muted);margin:2px 0 0}.pb{padding:13px 14px}.btn{border:1px solid var(--line);background:white;border-radius:5px;padding:7px 10px;font-size:10px;font-weight:650;color:var(--ink)}.btn:hover{background:var(--pale);border-color:#9fbfb3}.primary{background:var(--green);border-color:var(--green);color:white}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 9px;font-size:10px;color:#536b69}.tabs button.on{background:var(--pale);border-color:#a4c4b6;color:#155b4f;font-weight:700}.family{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 13px}.family button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 9px;font-size:10px} block;font-size:10px;margin-top:3px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{background:white;border:1px solid var(--line);border-top:3px solid #9dc5b1;padding:11px;border-radius:5px}.step small{font-size:8px;color:var(--muted);text-transform:uppercase}.step b{display:block;font-size:11px;margin:5px 0}.step p{font-size:9px;color:var(--muted)}.footer{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:15px}.hide{display:none!important}@media(max-width:850px){.shell{grid-template-columns:185px 1fr}.main{padding:18px}.hero{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}@media(max-width:620px){.shell{display:block}.side{position:relative;min-height:0;height:auto;padding:10px}.brand{border:0;padding-bottom:7px}.cap,.foot{display:none}.nav{display:flex;overflow-x:auto;padding-top:7px}.nav button{white-space:nowrap;flex:none;padding:8px}.top{padding:10px 13px}.badge{font-size:8px}.main{padding:14px 11px 26px}.head h1{font-size:22px}.hero{padding:16px}.hero h2{font-size:21px}.hero-flow{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}.dgrid{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:80px 1fr 54px}.footer{display:block}.footer span{display:block;margin:3px 0}}

const parcels=[
{tag:'ET-B001',family:'Bovinos',parent:'TR-0910',product:'Picanha',category:'Nobres',origin:'Traseiro',lot:'B-0910',kg:45,phase:'Estocagem',place:'Câmara fria',hours:12,expiry:'19/11/2026',route:'Desossa',supplier:'Fornecedor A'},
{tag:'ET-B002',family:'Bovinos',parent:'TR-0910',product:'Contrafilé',category:'Nobres',origin:'Traseiro',lot:'B-0910',kg:74,phase:'Estocagem',place:'Câmara fria',hours:12,expiry:'19/11/2026',route:'Desossa',supplier:'Fornecedor A'},
{tag:'ET-B003',family:'Bovinos',parent:'DI-0909',product:'Acém',category:'Intermediários',origin:'Dianteiro',lot:'B-0909',kg:180,phase:'Estocagem',place:'Câmara fria',hours:24,expiry:'18/11/2026',route:'Desossa',supplier:'Fornecedor A'},
{tag:'ET-B004',family:'Bovinos',parent:'DI-0909',product:'Acém',category:'Intermediários',origin:'Dianteiro',lot:'B-0909',kg:20,phase:'Abastecimento',place:'Balcão',hours:24,expiry:'18/11/2026',route:'Desossa',supplier:'Fornecedor A'},
{tag:'ET-S001',family:'Suínos',parent:'CS-0401',product:'Pernil',category:'Sem classe confirmada',origin:'Recebido em caixa',lot:'S-0401',kg:120,phase:'Manipulação',place:'Manipulação',hours:30,expiry:'17/11/2026',route:'Caixaria / manipulação',supplier:'Fornecedor B'},
{tag:'ET-S002',family:'Suínos',parent:'CS-0401',product:'Pernil',category:'Sem classe confirmada',origin:'Recebido em caixa',lot:'S-0401',kg:280,phase:'Estocagem',place:'Câmara fria',hours:30,expiry:'17/11/2026',route:'Caixaria / manipulação',supplier:'Fornecedor B'},
{tag:'ET-A001',family:'Aves',parent:'CX-0201',product:'Filé de peito',category:'Sem classe confirmada',origin:'Recebido em caixa',lot:'A-0201',kg:600,phase:'Estocagem',place:'Câmara fria',hours:18,expiry:'20/11/2026',route:'Caixaria / manipulação',supplier:'Fornecedor C'},

{tag:'ET-E001',family:'Embutidos',parent:'EM-0110',product:'Linguiça',category:'Sem classe confirmada',origin:'Recebido em caixa',lot:'E-0110',kg:160,phase:'Exposição',place:'Balcão',hours:9,expiry:'22/11/2026',route:'Recebimento direto',supplier:'Fornecedor D'}];
const pages=[['inicio','Ordens do dia / fluxo'],['cadastro','Cadastro Padrão'],['parametros','Parametrização'],['preconciliacao','Pré-conciliação'],['fluxo','Fluxo nativo'],['gestao','Gestão Operacional'],['estoque','Estoque em Movimento'],['dossie','Dossiê do ciclo']];
const phases=['Ponto Zero','Recepção / Aferição','Pós-aferição','Desossa / Caixaria','Pós-desossa','Estocagem / abastecimento','Portal de fechamento'];let page='inicio',family='Bovinos',stockFamily='Todas',stockPlace='Todos',stockPhase='Todas',stockQuery='',tab='panorama',selected='';

function nav(){return pages.map(([id,label])=>`<button data-page="${id}" class="${page===id?'on':''}">${label}</button>`).join('')}
function familyTabs(){return `<div class="family">${Object.keys(families).map(f=>`<button data-family="${f}" class="${family===f?'on':''}">${f}</button>`).join('')}</div>`}
function bridge(){return `<div class="steps">${phases.map((x,i)=>`<article class="step"><small>REFERÊNCIA ${String(i+1).padStart(2,'0')}</small><b>${x}</b><p>${['Parâmetro e documento identificados','Objeto recebido e massa aferida','Encaminhado, recebido ou remanescente','Transformação ou rota da Caixaria','Resultado aferido e destinado','Massa em posição e movimento','Balanço e prestação de contas'][i]}</p></article>`).join('')}</div>`}
function home(){let total=sum(parcels);return head('Gestão Operacional · entrada do dia','Ordens do dia / fluxo a executar','Resumo gerencial do dia: volume, famílias e percurso previsto. Os detalhes e atos permanecem no fluxo nativo.')+`<section class="hero"><div><div class="mini">ORBI GESTOR · PROTEÍNAS ANIMAIS</div><h2>Origem clara.<br>Massa em movimento.<br>Fluxo sob coordenação.</h2><p>Protótipo navegável para aproximar Cadastro Padrão, pré-conciliação e Gestão Operacional, com consulta macro e descida até a etiqueta.</p><div class="tabs"><button class="on" data-page="cadastro">Abrir Cadastro</button><button data-page="estoque">Abrir Estoque</button></div></div><div class="hero-flow">${[['ORIGEM','OP / XML'],['PARÂMETRO','Cadastro'],['VALIDAÇÃO','Ponto Zero'],['MASSA','Aferição'],['CUSTÓDIA','Estoque']].map(x=>`<span><b>${x[0]}</b>${x[1]}</span>`).join('')}</div></section><div class="kpis">${kpi('Massa no cenário',fmt(total),'kg','Exemplo sintético')}${kpi('Famílias',4,'','Bovinos · Suínos · Aves · Embutidos')}${kpi('Parcelas identificadas',parcels.length,'','Etiquetas de demonstração')}${kpi('Fases do percurso',phases.length,'','Ponto Zero ao Portal')}</div><div class="grid2">${panel('Massa por família','Volumes ilustrativos para orientar a navegação.',`<div class="bars">${Object.keys(families).map((f,i)=>{let n=sum(parcels.filter(x=>x.family===f));return `<div class="barrow"><span>${f}</span><div class="track"><div class="fill ${i===1?'gold':''}" style="width:${n/total*100}%"></div></div><b>${fmt(n)} kg</b></div>`}).join('')}</div>`)}${panel('Origem e percurso','O Cadastro fornece referência; o fluxo nativo confirma os fatos.',`<div class="note">Os dados desta página são sintéticos e servem apenas para demonstrar navegação e indicadores.</div><button class="btn primary" data-page="fluxo">Ver percurso completo →</button>`)}</div>${bridge()}`}
function catalog(){let f=families[family];return head('Cadastro Padrão · famílias e genealogia','Estrutura de produtos','Navegue por família, produto-pai e descendência. A demonstração não grava nem aprova parâmetros.')+familyTabs()+`<div class="grid2">${panel(family+' · árvore de produtos','Identidade e genealogia de referência.',`<div class="gene"><span>${f.parent}</span><i>→</i><span>${f.products[0]}</span><i>→</i><span>Produto / corte</span></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Origem / pai</th><th>Classificação</th><th></th></tr></thead><tbody>${f.products.map((p,i)=>`<tr><td><b>${p}</b></td><td>${f.parent}${family==='Bovinos'?`<span class="sub">${i<2?'Traseiro':'Dianteiro'}</span>`:''}</td><td><span class="status ${family==='Bovinos'?'warn':''}">${family==='Bovinos'?['Nobre','Nobre','Intermediário','Sem classe confirmada','Sem classe confirmada'][i]:'Sem classificação confirmada'}</span></td><td><button class="btn" data-page="estoque" data-filter="${family}">Consultar estoque</button></td></tr>`).join('')}</tbody></table></div>`)}${panel('Rotas de operação','Rotas mantêm seu próprio fluxo e autoridade.',`<p>Caixaria / Manipulação · destino de estocagem</p><p style="margin-top:8px">Caixaria Direta · protocolo de aferição para ERP</p><div class="note">Categoria e genealogia só devem ser tratadas como confirmadas quando houver parâmetro vigente.</div><button class="btn" data-page="parametros">Abrir parâmetros →</button>`)}</div>${bridge()}`}
function parameters(){let f=families[family];let rows=[['Identidade / genealogia',f.parent+' → '+f.products[0],'Estrutura demonstrativa','Rascunho'],['Unidade-base',family,'kg','A confirmar'],['Perfil de apresentação',f.products[0],'Não definido','Sem fonte'],['Rendimento projetado',f.products[0],'Não calculado','Sem fonte aplicável'],['Conciliação ERP',family,'Código / unidade / parceiro','Exemplo sintético']];return head('Cadastro Padrão · controle de parâmetros','Parametrização por família','A ficha organiza identidade, versão, vigência e fonte. Os valores não constituem parâmetro operacional aprovado.')+familyTabs()+`<div class="kpis">${kpi('Família',family,'','Escopo selecionado')}${kpi('Produto-pai',f.parent,'','Genealogia ilustrativa')}${kpi('Versão','DEMO-1','','Não vigente')}${kpi('Rendimento','—','','Não calculado')}</div>${panel('Matriz de parâmetros','Estados demonstrativos; sem gravação no Cadastro.',`<div class="table-wrap"><table><thead><tr><th>Parâmetro</th><th>Escopo</th><th>Valor</th><th>Fonte / estado</th><th>Consumidor</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i===3?`<span class="status warn">${esc(x)}</span>`:esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="note">Uma configuração real precisa de identidade, versão, vigência, fonte e autoridade. Esta tela é apenas uma proposta visual.</div>`)}`}
function precon(){return head('Pré-conciliação ERP / ORBI','Preparar a entrada documental','Confronto sintético por linha antes do Ponto Zero. A aprovação continua pertencendo ao fluxo nativo.')+familyTabs()+panel('Documento de demonstração · OP/XML DEMO-0909','Exemplo de identidade documental; não representa NF real.',`<div class="kpis">${kpi('Documento','DEMO-0909','','Fornecedor A · sintético')}${kpi('Linhas',3,'','Exemplo')}${kpi('Massa declarada','100','kg','Ilustrativa')}${kpi('Referência','DEMO-1','','Não vigente')}</div><div class="table-wrap"><table><thead><tr><th>Linha</th><th>Produto</th><th>Cadastro</th><th>Confronto</th><th>Próximo passo</th></tr></thead><tbody>${[['01','Traseiro bovino','Bovinos · pai','Coincide no exemplo','Ponto Zero'],['02','Carcaça suína','Suínos · unidade','Revisar unidade','Conferência documental'],['03','Frango em caixa','Aves · perfil','Sem perfil demonstrado','Qualificar referência']].map(r=>`<tr>${r.map((x,i)=>`<td>${i===3?`<span class="status ${i===3&&x.startsWith('Coincide')?'ok':'warn'}">${x}</span>`:esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="note">Ausência de informação permanece como lacuna; nunca vira zero ou aprovação.</div>`)+bridge()}
function flow(){return head('Fluxo nativo · referências e entregas','Ponto Zero ao Portal de fechamento','Cada checkpoint tem autoridade, entrada, fato registrado e saída para o próximo consumidor.')+bridge()+panel('Identidade da navegação','Os pontos de referência ajudam a localizar o ato e sua entrega.',`<div class="note">Cadastro e pré-conciliação preparam a referência. A operação confirma identidade e massa nos checkpoints; o Portal consolida os resultados do ciclo.</div>`) }
function management(){let total=sum(parcels);let places=['Câmara fria','Manipulação','Autosserviço','Balcão'];return head('Gestão Operacional · visão macro','Coordenar fluxo, massa e decisão','Indicadores sintéticos de volume por família, fase e ambiente; o detalhe pode ser consultado por etiqueta.')+`<div class="kpis">${kpi('Massa no recorte',fmt(total),'kg','Sintética')}${kpi('Câmara fria',fmt(sum(parcels.filter(x=>x.place==='Câmara fria'))),'kg','Posição demonstrativa')}${kpi('Manipulação',fmt(sum(parcels.filter(x=>x.place==='Manipulação'))),'kg','Fase atual sintética')}${kpi('Sem validade informada',parcels.filter(x=>!x.expiry).length,'parcelas','Conferir referência')}</div><div class="grid2">${panel('Massa por ambiente','Retrato sintético do fluxo.',`<div class="bars">${places.map((p,i)=>{let n=sum(parcels.filter(x=>x.place===p));return `<div class="barrow"><span>${p}</span><div class="track"><div class="fill ${i===1?'gold':''}" style="width:${n/total*100}%"></div></div><b>${fmt(n)} kg</b></div>`}).join('')}</div>`)}${panel('Leitura gerencial','Sinais para orientar a consulta.',`<p>Família de maior volume: <b>Aves</b></p><p style="margin-top:8px">Origem bovina: <b>Dianteiro e Traseiro</b></p><div class="note">A decisão operacional depende dos registros e autoridades do fluxo nativo.</div><button class="btn primary" data-page="estoque">Abrir Estoque em Movimento →</button>`)}</div>${bridge()}`}
function stock(){let rows=parcels.filter(x=>(stockFamily==='Todas'||x.family===stockFamily)&&(stockPlace==='Todos'||x.place===stockPlace)&&(stockPhase==='Todas'||x.phase===stockPhase)&&(!stockQuery||[x.tag,x.lot,x.product,x.supplier,x.origin].join(' ').toLowerCase().includes(stockQuery.toLowerCase())));let total=sum(rows),selectedRow=parcels.find(x=>x.tag===selected);let places=['Câmara fria','Manipulação','Autosserviço','Balcão'];let content='';if(tab==='panorama')content=`<div class="grid2">${panel('Massa por ambiente','Posições mutuamente exclusivas neste cenário.',`<div class="bars">${places.map((p,i)=>{let n=sum(rows.filter(x=>x.place===p));return `<div class="barrow"><span>${p}</span><div class="track"><div class="fill ${i===1?'gold':''}" style="width:${total?n/total*100:0}%"></div></div><b>${fmt(n)} kg</b></div>`}).join('')}</div>`)}${panel('Prioridades de consulta','Sem movimentar saldo.',`<p>Validade ausente: <b>${rows.filter(x=>!x.expiry).length} parcela(s)</b></p><p style="margin-top:8px">Mais de 24 h na fase: <b>${fmt(sum(rows.filter(x=>x.hours>24)))} kg</b></p><div class="note">Selecione uma etiqueta para abrir o DNA da parcela.</div><button class="btn" data-tab="parcelas">Ver etiquetas →</button>`)}</div>`;else content=panel(tab==='parcelas'?'Parcelas e etiquetas':tab==='categorias'?'Categoria e genealogia':'Fases e permanência','Consulte a identidade, origem, massa e estado demonstrativo.',`<div class="table-wrap"><table><thead><tr><th>Lote / etiqueta</th><th>Família / produto</th><th>Origem / genealogia</th><th>Fase / ambiente</th><th>Massa</th><th>Validade</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.lot||'Lote não declarado'}</b><span class="sub">${x.tag}</span></td><td>${x.family}<span class="sub">${x.product} · ${x.category}</span></td><td>${x.origin}<span class="sub">${x.parent||'Sem lote-pai'} → ${x.product}</span></td><td>${x.phase}<span class="sub">${x.place}</span></td><td>${fmt(x.kg)} kg</td><td>${x.expiry||'Sem informação'}</td><td><button class="btn" data-tag="${x.tag}">Abrir DNA</button></td></tr>`).join('')}</tbody></table></div>`);let detail=selectedRow?`<section class="detail"><b>${selectedRow.tag} · ${selectedRow.product}</b><button class="btn" data-close style="float:right">Fechar</button><div class="gene"><span>${selectedRow.family}</span><i>→</i><span>${selectedRow.parent||'Origem não declarada'} · ${selectedRow.origin}</span><i>→</i><span>${selectedRow.product}</span><i>→</i><span>${selectedRow.tag}</span></div><div class="dgrid">${[['Massa',fmt(selectedRow.kg)+' kg'],['Fase',selectedRow.phase],['Ambiente',selectedRow.place],['Permanência',selectedRow.hours+' h'],['Validade',selectedRow.expiry||'Não informada'],['Fornecedor',selectedRow.supplier],['Rota',selectedRow.route],['Custódia','ORBI · cenário']].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="note">Identidade, posição e permanência são dados sintéticos; não foram lidos do ORBI operacional.</div></section>`:'';return head('Gestão Operacional / Estoque em Movimento','Massa, DNA e fase atual','Visão macro por família, volume e ambiente; visão micro por lote, etiqueta, origem, validade e posição.')+`<div class="filters"><div class="field"><label>Família</label><select id="family-filter"><option>Todas</option>${Object.keys(families).map(x=>`<option ${x===stockFamily?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ambiente</label><select id="place-filter"><option>Todos</option>${places.map(x=>`<option ${x===stockPlace?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Fase</label><select id="phase-filter"><option>Todas</option>${[...new Set(parcels.map(x=>x.phase))].map(x=>`<option ${x===stockPhase?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="flex:1;min-width:190px"><label>Etiqueta, lote, produto ou origem</label><input id="query-filter" value="${esc(stockQuery)}" placeholder="Ex.: ET-B001, Picanha, Dianteiro"></div><button class="btn" data-clear>Limpar</button></div>${familyTabs()}<div class="kpis">${kpi('Massa filtrada',fmt(total),'kg','Soma das parcelas visíveis')}${kpi('Lotes',new Set(rows.map(x=>x.lot).filter(Boolean)).size,'','Identidades declaradas')}${kpi('Etiquetas',rows.length,'','Parcelas demonstrativas')}${kpi('Sem validade',rows.filter(x=>!x.expiry).length,'','Conferir fonte')}</div><div class="tabs">${[['panorama','Panorama'],['parcelas','Parcelas / etiquetas'],['categorias','Categorias / genealogia'],['movimentos','Fases / permanência']].map(x=>`<button class="${tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>${content}${detail}${bridge()}`}
function dossier(){return head('Consulta · dossiê','Prestação de contas do ciclo','O dossiê reúne as fontes que sustentam os indicadores; esta demonstração mostra a estrutura prevista.')+`<div class="grid2">${panel('Documento e parâmetro','Identidade, versão, fonte e vigência.',`<div class="note">O documento de origem e os parâmetros aplicáveis devem acompanhar cada linha do ciclo.</div>`)}${panel('Massa e fluxo','Aferida, encaminhada, recebida, remanescente e destino.',`<div class="note">Os valores de exemplo não representam saldo real nem aceite operacional.</div>`)}</div>${bridge()}`}
function render(){document.getElementById('nav').innerHTML=nav();let labels=Object.fromEntries(pages);document.getElementById('crumb').textContent='ORBI GESTOR / '+labels[page];let views={inicio:home,cadastro:catalog,parametros:parameters,preconciliacao:precon,fluxo:flow,gestao:management,estoque:stock,dossie:dossier};document.getElementById('main').innerHTML=(views[page]||home)()+`<div class="footer"><span>Identidade documental + objeto/massa + fase + destino</span><span>v26 · dados sintéticos · sem API, banco ou ERP</span></div>`}
function setPage(id){page=id;history.pushState(null,'','#'+id);render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){if(b.dataset.filter)stockFamily=b.dataset.filter;setPage(b.dataset.page);return}if(b.dataset.family){family=b.dataset.family;if(page==='estoque')stockFamily=family;render();return}if(b.dataset.tab){tab=b.dataset.tab;selected='';render();return}if(b.dataset.tag){selected=b.dataset.tag;render();document.querySelector('.detail')?.scrollIntoView({block:'center'});return}if(b.hasAttribute('data-close')){selected='';render();return}if(b.hasAttribute('data-clear')){stockFamily='Todas';stockPlace='Todos';stockPhase='Todas';stockQuery='';selected='';render()}});
document.addEventListener('change',e=>{if(e.target.id==='family-filter')stockFamily=e.target.value;if(e.target.id==='place-filter')stockPlace=e.target.value;if(e.target.id==='phase-filter')stockPhase=e.target.value;if(['family-filter','place-filter','phase-filter'].includes(e.target.id)){selected='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='query-filter'){stockQuery=e.target.value;let pos=stockQuery.length;render();let q=document.getElementById('query-filter');q?.focus();q?.setSelectionRange(pos,pos)}});
window.addEventListener('popstate',()=>{page=location.hash.slice(1)||'inicio';render()});page=location.hash.slice(1)||'inicio';if(!pages.some(x=>x[0]===page))page='inicio';render();
</script>
</body></html>
